name: Reset releases
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh release list --limit 500 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done
