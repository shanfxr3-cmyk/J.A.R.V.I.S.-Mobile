name: Android build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          test -f jarvis-project.zip || { echo "jarvis-project.zip not found in repo root"; exit 1; }
          mkdir project
          unzip -q jarvis-project.zip -d project
          ls -R project | head -50
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle -p project assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
