name: Android build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          test -f jarvis-project.zip || { echo "jarvis-project.zip not found in repo root"; exit 1; }
          mkdir project
          unzip -q jarvis-project.zip -d project
      - name: Download hand landmark model
        run: |
          mkdir -p project/app/src/main/assets
          curl -fL --retry 3 -o project/app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          ls -l project/app/src/main/assets
          test "$(stat -c%s project/app/src/main/assets/hand_landmarker.task)" -gt 1000000
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle -p project assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
