name: Android build

# Upload jarvis-project.zip to the repo root, then run this workflow
# (Actions > Android build > Run workflow). It also runs automatically when the zip changes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'jarvis-project.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          ZIP=$(find . -maxdepth 2 -name 'jarvis-project*.zip' | head -n 1)
          test -n "$ZIP" || { echo "jarvis-project.zip not found in the repo"; exit 1; }
          rm -rf project && mkdir project && unzip -q "$ZIP" -d project
          SETTINGS=$(find project -maxdepth 3 -name settings.gradle.kts | head -n 1)
          test -n "$SETTINGS" || { echo "settings.gradle.kts not found in the zip"; exit 1; }
          echo "SRC=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Download hand tracking model
        run: |
          mkdir -p "$SRC/app/src/main/assets"
          curl -L --fail --retry 3 -o "$SRC/app/src/main/assets/hand_landmarker.task" \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Add Node.js for Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$SRC/app/src/main/jniLibs/arm64-v8a"
          if gh release download node-android --repo "$GITHUB_REPOSITORY" --pattern '*.so' --dir "$SRC/app/src/main/jniLibs/arm64-v8a"; then
            test -f "$SRC/app/src/main/jniLibs/arm64-v8a/libnode.so" || { echo "::error::The node-android release has no libnode.so. Run 'Get Node for Android' again."; exit 1; }
            ls -la "$SRC/app/src/main/jniLibs/arm64-v8a"
          else
            echo "::warning::No node-android release yet. Run the 'Get Node for Android' workflow once. This APK is built without Node."
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jarvis-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing. This APK will NOT update over your installed app and will not be published as a release."
          fi

      - name: Build signed release APK
        working-directory: ${{ env.SRC }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' "$SRC/app/build.gradle.kts" | head -n 1)
          VC=$((GITHUB_RUN_NUMBER + 100))
          APK=$(find "$SRC/app/build/outputs/apk/release" -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "No APK was produced"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/Jarvis-Mobile-v${VN}-build${VC}.apk"
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "VC=$VC" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: dist/*.apk

      - name: Publish release (only when signed with your key)
        if: env.KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VC }}
          name: J.A.R.V.I.S. Mobile v${{ env.VN }} (build ${{ env.VC }})
          body: |
            J.A.R.V.I.S. Mobile v${{ env.VN }}, build ${{ env.VC }}.
            Install this over your existing app, or update from inside the app: Settings, About, Updates.
          files: dist/*.apk
          make_latest: true

      - name: Sync legal files to repo root
        run: |
          for f in LICENSE NOTICE README.md SECURITY.md PRIVACY_POLICY.md TERMS_AND_CONDITIONS.md USAGE_POLICY.md FORK_AND_BRANDING_RULES.md THIRD_PARTY_NOTICES.md; do
            if [ -f "$SRC/$f" ]; then cp "$SRC/$f" "./$f"; git add "./$f"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || { git commit -m "Sync licence and policy files" && git push || true; }
